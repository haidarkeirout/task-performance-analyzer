name: Mirror to task-performance-v2

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required — grabs all branches/tags/history

      - name: Verify token is set (safe debug)
        run: |
          echo "Token length: ${#MIRROR_TOKEN}"
          echo "Token prefix: ${MIRROR_TOKEN:0:4}"
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}

      - name: Mirror to target repo
        run: |
          git remote add target https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com/baraa-sheikha/task-performance-v2.git
          git push target --mirror
